name: Legal Content CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML
      - name: Compile Python tooling
        run: python -m compileall -q scripts
      - name: Validate JSON documents
        run: find . -path ./.git -prune -o -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Enforce orchestrator tool scope
        run: python scripts/lint-tool-scope.py
      - name: Dry-run managed-agent cookbooks
        run: bash scripts/test-cookbooks.sh
